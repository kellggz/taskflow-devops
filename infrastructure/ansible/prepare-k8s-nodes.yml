---
- name: Preparar nodos para Kubernetes
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Desactivar swap temporalmente
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Desactivar swap permanentemente en fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Configurar módulos requeridos por Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: '0644'

    - name: Cargar módulo overlay
      ansible.builtin.command: modprobe overlay
      changed_when: false

    - name: Cargar módulo br_netfilter
      ansible.builtin.command: modprobe br_netfilter
      changed_when: false

    - name: Configurar parámetros de red para Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: '0644'

    - name: Aplicar parámetros del kernel
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Instalar containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Habilitar e iniciar containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Crear directorio de configuración de containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Generar configuración predeterminada de containerd
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Reiniciar containerd

    - name: Activar SystemdCgroup en containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false$'
        replace: '\1SystemdCgroup = true'
      notify: Reiniciar containerd

    - name: Instalar dependencias del repositorio de Kubernetes
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Crear directorio para llaves APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Descargar llave pública de Kubernetes
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Convertir llave al formato GPG
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configurar repositorio oficial de Kubernetes
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Instalar herramientas de Kubernetes
      ansible.builtin.apt:
        name:
          - kubelet=1.36.3-1.1
          - kubeadm=1.36.3-1.1
          - kubectl=1.36.3-1.1
        state: present
        update_cache: true

    - name: Retener paquetes de Kubernetes
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Reiniciar containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
