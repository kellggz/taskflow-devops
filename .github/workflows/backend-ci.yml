name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kellggz/taskflow-backend

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar pruebas automáticas
        run: python -m pytest backend/test_main.py -v

      - name: Construir imagen Docker
        run: docker build -f backend/Dockerfile -t taskflow-backend:ci .

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Publicar imagen en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          docker tag taskflow-backend:ci "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker tag taskflow-backend:ci "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  desplegar:
    name: Desplegar en Kubernetes
    if: github.event_name == 'push'
    needs: pruebas
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Aplicar manifiestos en Kubernetes
        shell: bash
        run: |
          (
            sed "s|ghcr.io/kellggz/taskflow-backend:latest|${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}|" infrastructure/kubernetes/backend-deployment.yml
            cat infrastructure/kubernetes/backend-service.yml
          ) | ssh -o BatchMode=yes \
            -i /home/devops/.ssh/ansible_ed25519 \
            devops@192.168.207.11 \
            'kubectl apply -f -'

      - name: Esperar el despliegue
        run: |
          ssh -o BatchMode=yes \
            -i /home/devops/.ssh/ansible_ed25519 \
            devops@192.168.207.11 \
            'kubectl rollout status deployment/taskflow-backend --timeout=180s'

      - name: Verificar la salud del backend
        run: |
          curl --fail --retry 10 --retry-delay 5 \
            http://192.168.207.11:30080/health
